control_mux_node:
  ros__parameters:
    mode: auto                        # auto (navigation drives) | remote (teleop drives)
    remote_timeout_sec: 0.3           # zero the robot when teleop goes silent
    nav_timeout_sec: 0.5              # zero the robot when navigation goes silent in auto mode
    pause_nav_on_remote: true         # pause navigation while the remote drives
    estop_hold_hz: 10.0               # zero commands per second while the e-stop is engaged
    # Speed envelope: no source may command more (x and y are scaled together, keeping the
    # direction); non-finite commands are dropped as zero.
    max_vx: 1.0                       # m/s
    max_vy: 0.5                       # m/s
    max_wz: 1.5                       # rad/s

    # Protective field: limit every command to a speed that still stops `margin` before the
    # nearest obstacle in the swept path (perception/safety_scan, 360 deg).
    field_in_auto: true
    field_in_remote: true             # also protects the robot from the handheld driver
    safety_scan_timeout_sec: 0.5      # older scan: auto mode stops, remote mode creeps
    stale_remote_speed: 0.15          # m/s cap for the handheld while the scan is stale
    field.front: 0.40                 # m, base_link to the front edge
    field.rear: 0.40                  # m, base_link to the rear edge
    field.half_width: 0.28            # m, base_link to the side edges
    field.max_decel: 0.6              # m/s^2, braking the robot reliably achieves
    field.reaction_time: 0.25         # s, sensing + command latency
    field.margin: 0.15                # m, gap kept to the obstacle
    field.lateral_margin: 0.10        # m, extra width of the swept path
    field.min_speed: 0.02             # m/s, slower commands are not limited

teleop_udp_node:
  ros__parameters:
    port: 9870
    token: ""                         # shared secret; when set every message must carry "k"
    robot_name: ""                    # name in discovery beacons (default: hostname)
    client_timeout_sec: 2.0
    max_vx: 1.0                       # m/s, clamp on teleop commands
    max_vy: 0.5
    max_wz: 1.5
    telemetry_hz: 10.0
    robot_command_prefix: /robot/     # driver services; robot.launch.py sets /<robot_ns>/
    # Commands shown on the handheld, each a std_srvs/Trigger <prefix><name> of the robot driver.
    # Add the robot's own (gait, speed modes, ...) in the site file, see src/xtras/README.md.
    robot_commands: [stand_up, sit_down, emergency_stop]
    routes_dir: /home/robot/dev/Pashupati/map
    map_frame: map
    base_frame: base_link
    camera_topic: /camera/camera/color/image_raw/compressed
    camera_compressed: true           # false: raw rgb8/bgr8 Image, JPEG-encoded here
    camera_fps: 8.0
    camera_jpeg_quality: 60
    camera_max_width: 640
    camera_max_bytes: 60000           # bigger driver JPEGs are re-encoded (needs OpenCV)
    lidar_topic: /cloud_registered_body   # FAST-LIO body-frame cloud
    lidar_hz: 2.0
    lidar_voxel: 0.1
    lidar_max_points: 3000
