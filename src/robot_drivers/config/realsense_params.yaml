realsense_camera:
  ros__parameters:
    camera_name: camera
    camera_namespace: camera
    enable_color: true
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    align_depth.enable: true
    pointcloud.enable: true
    depth_module.profile: 848x480x30
    rgb_camera.profile: 848x480x30
    enable_gyro: true
    enable_accel: true
    unite_imu_method: 2
    publish_tf: true
    tf_publish_rate: 0.0