lidar_sector_node:
  ros__parameters:
    num_sectors: 32
    fov_deg: 180.0
    range_max: 8.0
    obstacle_z_min: 0.05
    obstacle_z_max: 1.20
    publish_markers: true
    marker_lifetime_sec: 0.3
    corridor_x_min: 0.0
    corridor_x_max: 5.0
    corridor_y_min: -1.0
    corridor_y_max: 1.0

anomaly_detector_node:
  ros__parameters:
    ollama_model: moondream
    check_interval_sec: 2.0
    publish_annotated: true
    jpeg_quality: 90