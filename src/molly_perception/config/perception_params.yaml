lidar_sector_perception_node:
  ros__parameters:
    livox_custom_topic: /livox/lidar   # type: livox_ros_driver2/msg/CustomMsg (xfer_format:=1 on the driver)
    sectorscan_topic: /molly/perception/sector_scan
    marker_topic: /molly/perception/markers
    base_frame: base_link
    num_sectors: 32
    fov_deg: 180.0              # -90..+90 deg, depan aja
    range_max: 8.0
    obstacle_z_min: 0.05
    obstacle_z_max: 1.20
    lidar_offset_x: 0.0         # ganti sesuai mounting payload Molly
    lidar_offset_y: 0.0
    lidar_offset_z: 0.0
    lidar_yaw_deg: 0.0
    publish_markers: true
    marker_lifetime_sec: 0.3
