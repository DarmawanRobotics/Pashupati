# Per-robot site configuration: scripts/setup.sh install config copies it to
# /etc/pashupati/site.yaml (SITE_CONFIG in the env file); edit it there, then restart the service.
# An ordinary ROS 2 parameter file keyed by node name, merged on top of config/stack.yaml, so
# tuning for one site or one robot never needs a change in the repository. Unknown node names
# are reported at start; a broken file stops the launch. The robot itself (footprint, limits,
# braking) is the robot profile: robot_params:= / ROBOT_PARAMS (config/robot.yaml is the
# default), never this file.

# ---------------------------------------------------------------- this robot

teleop_udp_node:
  ros__parameters:
    token: "change-me" # shared secret, the same in the handheld app settings
    # The handheld's action menu: std_srvs/Trigger services of the robot driver (/<ROBOT_NS>/<name>)
    robot_commands: [stand_up, sit_down, emergency_stop]

lidar_sector_node:
  ros__parameters:
    filter:
      height_min: 0.10 # m above the floor: lower is floor (raise on uneven floors)

# docking_node:                       # a robot with a charging dock (driver services)
#   ros__parameters:
#     goal.distance: 0.75             # m, base_link to the dock tag when docked
#     hooks.sit: [/robot/sit]
#     hooks.charge: [/robot/charge/start]
#     hooks.stop_charge: [/robot/charge/stop]
#     hooks.stand: [/robot/stand]

# health_monitor_node:                # the driver's own nodes must run too
#   ros__parameters:
#     nodes:
#       expected: [/robot/driver_node]

# video_stream_node:                  # the handheld's WebRTC video (MediaMTX)
#   ros__parameters:
#     bitrate_kbps: 800               # weak Wi-Fi: lower it
#     fps: 10.0

# rtsp_camera:                        # CAMERA=rtsp: rectify with a calibration
#   ros__parameters:
#     calibration_file: /etc/pashupati/camera.yaml

# ---------------------------------------------------------------- this site

path_follower_node:
  ros__parameters:
    speed:
      cruise: 0.35 # m/s, patrol speed for this site (the handheld changes it live)
    low_battery: 0.25 # below: the patrol ends its lap

fleet_uplink_node:
  ros__parameters:
    robot_id: robot-01 # ROBOT_ID in the env file wins when set


