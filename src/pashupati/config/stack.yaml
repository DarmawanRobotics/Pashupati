# Per-node overrides of the package defaults for a Pashupati patrol robot (only what differs).
# Merged with the site file (params_file:=, /etc/pashupati/site.yaml; later wins) and passed to
# every package launch. A section that matches no started node is reported at launch (typo).
# Parameters per package: their READMEs, `ros2 param describe /<node> <name>`.

# ---------------------------------------------------------------- Dharma

# FAST-LIO keeps Dharma's mapping.extrinsic_est_en: false. The on-line extrinsic estimation of
# Pashupati 2.0 let the odometry tilt and drift in z in the open mall (odometry_monitor: "odom
# tilted", "z drift"); the Mid-360's IMU is built in and calibrated.

odometry_gate:
  ros__parameters:
    max_tilt_deg: 8.0 # a standing quadruped leans a little; catches a sitting robot

odometry_monitor_node:
  ros__parameters:
    trip:
      file: ~/.pashupati/trip.json # with the robot's other state; reset from the handheld
    tilt:
      # FAST-LIO's frame starts as tilted as the IMU (it does not level to gravity): a start the
      # gate accepts (up to 8 deg) is no drift; only more than that counts as one
      max_deg: 9.0

lidar_sector_node:
  ros__parameters:
    # front: Dharma's 180 deg (32 sectors); 360 only for a back-up after an inspection
    # (path_follower_node inspection.reverse_distance_m > 0)
    filter:
      height_max: 1.55 # m above the floor (base_link + 1.20 m)
      # As Pashupati 2.0: a fixed height band on base_link. Leveling with the odometry's tilt
      # turned a slightly tilted odometry into ghost obstacles (the floor a metre or two away):
      # the robot stopped and weaved around nothing. The mall floor is flat.
      level_source: none
    memory:
      enabled: false # as 2.0: remembered points (odom frame, 10 s) kept those ghosts around
    depth:
      # The RealSense D435i, pitched 10 deg down, sees the floor right ahead, where the Mid-360
      # on top sees nothing below ~40 cm within a metre: a box, a bag or a low step there stops
      # the robot or is passed around. The cloud comes from the robot package (l1w_bringup
      # realsense_params.yaml: depth 424 x 240 decimated, no texture). The floor is fitted in
      # every cloud: the TODO pitch of the mount (10 deg) is logged against the floor once a
      # minute ("depth camera floor fitted"). A silent camera leaves the scans to the LiDAR.
      enabled: true # the camera's low obstacles join both scans; false: the LiDAR alone
      topic: /camera/camera/depth/color/points # PointCloud2 of realsense2_camera
      memory_sec: 6.0 # s, a low box beside the robot (out of the camera's view) is kept

localization_node:
  ros__parameters:
    tag:
      frames: [base_map, charging_dock] # the AprilTag frames (dharma_perception tag.frames)

path_loader_node:
  ros__parameters:
    remember_file: ~/.pashupati/last_route # the route loaded last comes back after a restart

path_follower_node:
  ros__parameters:
    loop_route: true # patrol: a closed route starts its next lap (not on low battery)
    speed:
      accel: 0.5 # m/s^2 (Pashupati 2.0 linear_accel_limit)
      smoothing: 0.4
    safety:
      blocked_timeout_sec: 30.0 # s standing in front of an obstacle before BLOCKED
    hooks:
      # Inspection at every stop point: the VLM check answers (or, switched off, says so at
      # once); a hook whose node does not run is skipped, so INSPECTION=false never blocks.
      inspection: [/anomaly_detector_node/check_now]
      inspection_timeout_sec: 20.0 # VLM inference on the Jetson takes a few seconds
    inspection:
      reverse_distance_m: 0.0 # > 0: back up this far after the inspection (360 deg scan)

control_mux_node:
  ros__parameters:
    use_health_limit: true # scale commands by health/status speed_scale
    remote_sources: [handheld, dashboard] # control/remote/<source>/cmd_vel
    # REMOTE without the protective field: the operator watches the robot (field-tested
    # decision of Pashupati 1.0); the envelope and the e-stop still apply. sim.yaml keeps it on.
    field:
      in_remote: false

docking_node:
  ros__parameters:
    # Docking onto the charger: the robot driver's std_srvs/Trigger services, set them in the
    # site file for a robot that has a dock (empty: skipped). See dharma_sim's dock contract.
    hooks.sit: [""] # e.g. /robot/sit
    hooks.charge: [""] # e.g. /robot/charge/start
    hooks.stop_charge: [""]
    hooks.stand: [""]

health_monitor_node:
  ros__parameters:
    sensors:
      # "topic:min_hz[:max_age_sec]"; {robot_ns} is the driver namespace. The camera on
      # camera_info: subscribing the JPEG topic would make the driver encode every frame.
      topics:
        - /livox/lidar:5.0
        - /Odometry:8.0
        - /perception/sector_scan:5.0
        - /camera/camera/color/camera_info:5.0:0
        - /camera/camera/depth/camera_info:5.0:0 # the depth stream of the low obstacles
        - /{robot_ns}/odom:10.0
    degradation:
      rules: ["sensor:/livox/lidar=0.5", "sensor:/Odometry=0.5", "tf:*=0.5"]
    # the offset of this computer's clock to its time source (scripts/setup.sh install timesync)
    clock.enabled: true

# ---------------------------------------------------------------- Pashupati

teleop_udp_node:
  ros__parameters:
    token: "" # set it in the site file, and the same in the handheld
