# FAST-LIO2 (hku-mars ROS2 branch) tuned for a Livox Mid-360 on a quadruped, indoor mall.
fastlio_mapping_node:  
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3     
        max_iteration: 3         
        filter_size_surf: 0.5       
        filter_size_map: 0.5       
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1            # Livox CustomMsg (livox_ros_driver2 xfer_format 1)
            scan_line:  4
            blind: 0.5               # drops the robot's own body and legs
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0      # was 100: Mid-360 is rated ~40 m at 10 % reflectivity
            extrinsic_est_en:   true      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: false           # was true: FAST-LIO appends to /path forever (RAM and bandwidth grow)
            effect_map_en: false
            map_en: false            # was true: map publishing is commented out in this FAST-LIO anyway
            scan_publish_en:  true   # /cloud_registered_body feeds lidar_sector_node and teleop
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false       # odometry.launch.py sets this from save_map
            interval: -1
