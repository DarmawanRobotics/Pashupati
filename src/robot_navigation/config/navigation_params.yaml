path_follower_node:
  ros__parameters:
    control_rate: 20.0                # Hz, control loop frequency
    target_linear_velocity: 0.4       # m/s, cruise speed (keep low in crowds)
    max_linear_velocity: 0.6          # m/s, hard cap
    min_linear_velocity: 0.1          # m/s, floor of the speed profile (never crawl slower)
    max_lateral_accel: 0.3            # m/s^2, curvature speed limit v = sqrt(a / kappa)
    decel_limit: 0.3                  # m/s^2, braking used to plan speed into stops and the end
    approach_speed: 0.15              # m/s, speed when arriving at stop points and the route end
    max_angular_velocity: 1.0         # rad/s, hard cap
    linear_accel_limit: 0.5           # m/s^2, ramp limit (emergency stops bypass it)
    angular_accel_limit: 1.5          # rad/s^2, ramp limit
    arc_visualization_length: 2.0     # m, RViz curvature arc length
    marker_lifetime_sec: 0.5          # s, RViz marker lifetime

    avoidance_enabled: true           # blend obstacle avoidance into cmd_vel
    avoidance_timeout_sec: 0.5        # s, stop if navigation/avoidance goes silent (fail-safe)
    tf_timeout_sec: 0.5               # s, stop if map->base_link stops updating (odometry died)

    loop_route: true                  # patrol: restart the route when it ends (closed routes only)
    loop_close_distance: 1.0          # m, first/last waypoint gap that still counts as a closed loop

    stop_point_skip_margin: 5         # waypoints, progress past a stop point before it is skipped

    # Final approach onto stop points and the end of open routes
    holonomic: true                   # true: close x/y/yaw together (legged/omni), false: turn-drive-turn
    approach_radius: 0.5              # m, distance to a stop point that switches to the final approach
    approach_timeout_sec: 20.0        # s, give up converging and dwell where the robot is
    approach.kp_xy: 1.2               # P gain on position error
    approach.kp_yaw: 1.5              # P gain on yaw error
    approach.max_speed: 0.2           # m/s
    approach.max_yaw_rate: 0.6        # rad/s
    approach.min_speed: 0.04          # m/s, floor to beat the robot's joystick deadband
    approach.position_tolerance: 0.05 # m
    approach.yaw_tolerance_deg: 3.0   # deg

    # std_srvs/Trigger services called on navigation start/stop ("" = skip).
    # Genisom L1W example: /l1w/sdk_control_right and /l1w/remote_control_right
    auto_mode_on_service: ""
    auto_mode_off_service: ""

    # std_srvs/Trigger services called at every stop point after aligning ("" = none),
    # e.g. ["/anomaly_detector/check_now"]. The robot waits for them up to inspection_timeout_sec.
    inspection_services: [""]
    inspection_timeout_sec: 10.0

    controller: pure_pursuit          # pure_pursuit | pid | mppi

    pure_pursuit.lookahead_distance: 1.0
    pure_pursuit.goal_tolerance: 0.3

    pid.lookahead_distance: 1.0
    pid.goal_tolerance: 0.3
    pid.kp: 1.5
    pid.ki: 0.0
    pid.kd: 0.2

    mppi.goal_tolerance: 0.3
    mppi.horizon_steps: 15            # steps per rollout
    mppi.dt: 0.1                      # s per rollout step
    mppi.num_samples: 200             # rollouts per tick
    mppi.angular_std: 1.0             # rad/s, sampling noise
    mppi.temperature: 0.05            # softmax sharpness for the normalized cost
    mppi.window_points: 60            # path points ahead used for the tracking cost

    speed_regulator_enabled: false    # slow down on sharp turns
    speed_regulator.kp: 0.3
    speed_regulator.ki: 0.0
    speed_regulator.kd: 0.0
    speed_regulator.min_scale: 0.3

obstacle_avoidance_node:
  ros__parameters:
    algorithm: vfh                    # braitenberg | vfh
    safe_distance: 1.5                # m from base_link, obstacles closer than this shape the command
    emergency_distance: 0.75          # m from base_link (~0.4 m from the robot's nose), hard stop
    emergency_cone_deg: 60.0          # deg, frontal cone checked for hard stop / blocked front

    braitenberg.steering_gain: 1.5
    braitenberg.velocity_gain: 1.0
    braitenberg.steering_zone_center_deg: 45.0
    braitenberg.steering_zone_width_deg: 60.0
    braitenberg.velocity_zone_center_deg: 60.0
    braitenberg.velocity_zone_width_deg: 90.0
    braitenberg.following_zone_width_deg: 30.0
    braitenberg.smoothing: 0.85

    vfh.min_gap_width_deg: 20.0       # deg, narrowest passable gap
    vfh.steering_gain: 1.0            # gap-heading-to-steering strength
    vfh.velocity_gain: 1.0            # frontal-obstacle-to-speed strength
    vfh.smoothing: 0.85               # 0-1 output filter (higher = smoother/slower)

path_loader_node:
  ros__parameters:
    waypoints_file: ""                # route CSV (x,y,yaw_deg,dwell_sec)
    republish_period: 2.0             # s, RViz-only Path republish (0 = off); waypoints are latched
    smoothing_enabled: true           # resample + smooth between stop points (stop points never move)
    resample_spacing: 0.1             # m, uniform point spacing after resampling
    smooth_weight_data: 0.05          # pull toward the recording (higher = closer, noisier)
    smooth_weight_smooth: 0.4         # pull toward neighbours (higher = smoother), keep < 0.5
    max_smoothing_deviation: 0.3      # m, warn when smoothing moves the route further than this
