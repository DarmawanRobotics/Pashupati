# Site configuration for the simulator (robot_sim/sim.launch.py): the stack reads the simulated
# body-frame cloud, writes nothing into the real map/ or ~/.pashupati, and asks the simulator
# instead of the VLM to inspect at stop points.
lidar_sector_node:
  ros__parameters:
    input_type: pointcloud2
    pointcloud_topic: /cloud_registered_body

localization_node:
  ros__parameters:
    auto_localize_on_start: false     # no AprilTags in the sim: robot_sim sends /initialpose

path_loader_node:
  ros__parameters:
    route_state_file: /tmp/pashupati_sim/last_route

path_follower_node:
  ros__parameters:
    inspection_services: ["/sim/inspect"]   # sim_robot_node answers "clear"
    approach_timeout_sec: 10.0

route_recorder_node:
  ros__parameters:
    output_path: /tmp/pashupati_sim/routes/

teleop_udp_node:
  ros__parameters:
    token: sim
    routes_dir: /tmp/pashupati_sim/routes

fleet_uplink_node:
  ros__parameters:
    robot_id: sim-01
    spool_dir: /tmp/pashupati_sim/spool
    routes_dir: /tmp/pashupati_sim/routes

health_monitor_node:
  ros__parameters:
    topics:
      - /cloud_registered_body:5.0
      - /perception/sector_scan:5.0
      - /perception/safety_scan:5.0
      - /l1w/odom:10.0
      - /Odometry:8.0
