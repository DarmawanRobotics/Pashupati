name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vendor packages that live in src/xtras (submodules) or need hardware SDKs; CI builds and
  # tests the Pashupati packages only.
  ROSDEP_SKIP: >-
    livox_ros_driver2 fast_lio legkilo apriltag_draw
  PACKAGES: >-
    pashupati_inspection pashupati_bridge pashupati_fleet pashupati_inspection pashupati_health pashupati_rviz
    pashupati pashupati_sim

jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning script/*.sh docker/entrypoint.sh
      - name: YAML parses
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if 'xtras' in p.parts or '.git' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'all YAML files parse')
          sys.exit(1 if bad else 0)
          PY

  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the age check compares the commits of the PDFs and their sources
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the PDF guides
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            fonts-dejavu-core
          pip install weasyprint==70.0 markdown==3.11.1 pyyaml pillow
          python docs/pdf/build.py
      - name: Committed PDFs are up to date
        run: |
          stale() {
            local pdf=$1 built changed
            shift
            built=$(git log -1 --format=%ct -- "$pdf")
            changed=$(git log -1 --format=%ct -- "$@")
            if [[ -z "$built" || "$changed" -gt "$built" ]]; then
              echo "::warning file=$pdf::older than its sources: python3 docs/pdf/build.py, commit it"
            fi
          }
          stale docs/Pashupati-User-Manual.pdf docs/manual docs/pdf
          stale docs/Pashupati-Tuning-Guide.pdf docs/tuning docs/pdf 'src/*/config/*.yaml'
      - uses: actions/upload-artifact@v4
        with:
          name: guides
          path: docs/*.pdf

  build-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ROS_LOCALHOST_ONLY: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4   # no submodules: they need SSH keys and vendor SDKs
      - name: Dharma packages
        env:
          # the dharma repos are private: a fine-grained token with read access to them
          DHARMA_TOKEN: ${{ secrets.DHARMA_TOKEN }}
        run: |
          apt-get update && apt-get install -y python3-vcstool git
          git config --global url."https://x-access-token:${DHARMA_TOKEN}@github.com/".insteadOf \
            "git@github.com:"
          vcs import src < pashupati.repos
      - name: Dependencies
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys "$ROSDEP_SKIP"
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-up-to $PACKAGES --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          # sequential: the in-process ROS tests share one DDS domain
          colcon test --packages-select $PACKAGES --executor sequential \
            --event-handlers console_cohesion+
          if ! colcon test-result --verbose > test-result.txt 2>&1; then
            cat test-result.txt
            # the failures as one annotation too: on the run page and through the API
            msg=$(head -c 30000 test-result.txt \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Failing tests::$msg"
            exit 1
          fi
          cat test-result.txt
      - name: Launch smoke test
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch pashupati robot.launch.py --show-args > /dev/null
          ros2 launch dharma_odometry odometry.launch.py --show-args > /dev/null
          ros2 launch pashupati_sim sim.launch.py --show-args > /dev/null
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/*/test_results/**/*.xml
            /tmp/pashupati_sim_*.log
          if-no-files-found: ignore
