name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vendor packages that live in src/xtras (submodules) or need hardware SDKs; CI builds and
  # tests the Pashupati packages only.
  ROSDEP_SKIP: >-
    livox_ros_driver2 fast_lio legkilo l1w_bringup l1w_description l1w_driver
    realsense2_camera apriltag_draw
  PACKAGES: >-
    robot_interfaces robot_odometry robot_localization robot_perception robot_navigation
    robot_bridge robot_fleet robot_inspection robot_health robot_rviz pashupati

jobs:
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning script/*.sh docker/entrypoint.sh
      - name: YAML parses
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if 'xtras' in p.parts or '.git' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'all YAML files parse')
          sys.exit(1 if bad else 0)
          PY

  build-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ROS_LOCALHOST_ONLY: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4   # no submodules: they need SSH keys and vendor SDKs
      - name: Dependencies
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys "$ROSDEP_SKIP"
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select $PACKAGES --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          # sequential: the in-process ROS tests share one DDS domain
          colcon test --packages-select $PACKAGES --executor sequential \
            --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Launch smoke test
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 launch pashupati robot.launch.py --show-args > /dev/null
          ros2 launch robot_odometry odometry.launch.py --show-args > /dev/null
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/*/test_results/**/*.xml
          if-no-files-found: ignore
