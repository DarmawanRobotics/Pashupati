# Dev container: ROS 2 Humble, every dependency, an XFCE desktop over VNC (scripts/dev.sh up, or
# docker compose up -d --build). Build artefacts live in volumes, not in the bind mount.
name: pashupati

services:
  dev-humble:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: humble
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: pashupati-dev:humble
    container_name: pashupati-dev-humble
    hostname: pashupati-humble
    init: true
    stdin_open: true
    tty: true
    shm_size: 1gb
    environment:
      VNC: ${VNC:-1}
      VNC_PASSWORD: ${VNC_PASSWORD:-pashupati}
      VNC_RESOLUTION: ${VNC_RESOLUTION:-1600x900}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ports:
      - "127.0.0.1:5901:5901" # VNC (vnc://localhost:5901)
      - "127.0.0.1:6080:6080" # noVNC (http://localhost:6080/vnc.html)
    volumes:
      - .:/home/robot/ws
      - build-humble:/home/robot/ws/build
      - install-humble:/home/robot/ws/install
      - log-humble:/home/robot/ws/log

volumes:
  build-humble:
  install-humble:
  log-humble:
